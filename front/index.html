<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Document</title>
</head>

<body>
    <main id="main-principal">
        <div id="contenedor-imgs">
            <div class="contenedor-imgs-individual">
                <p>Original</p>
                <div class="contenedor-img">
                    <img id="img-original" src="media/demo.webp">
                </div>
            </div>
            <div class="contenedor-imgs-individual">
                <p>Transformada</p>
                <div class="contenedor-img">
                    <img id="img-editada" src="media/demo.webp">
                </div>
            </div>
            <div class="contenedor-imgs-individual">
                <p>Escaneada</p>
                <div class="contenedor-img">
                    <img id="img-escaneada" src="media/demo.webp">
                </div>
            </div>
        </div>
        <div id="contenedor-secundario">
            <div id="contenedor-tablas" style="display: none;">
                <div id="contenedor-tabla-cor" class="clase-tabla">
                    <p>Coordenadas detectadas</p>
                    <div class="contenedor-tabla">
                        <table id="tabla-coordenadas">
                            <thead>
                                <tr>
                                    <th>Esquina</th>
                                    <th>X</th>
                                    <th>Y</th>
                                </tr>
                            </thead>

                            <tbody id="tbody-coordenadas">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div id="contenedor-info-analisis" class="clase-tabla">
                    <p>Información del análisis</p>
                    <div class="contenedor-tabla">
                        <table id="tabla-info">
                            <thead>
                                <tr>
                                    <th>Info</th>
                                    <th>Valor</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Ancho resultado</td>
                                    <td id="ancho-resultado"></td>
                                </tr>

                                <tr>
                                    <td>Alto resultado</td>
                                    <td id="alto-resultado"></td>
                                </tr>

                                <tr>
                                    <td>Umbral</td>
                                    <td id="umbral-resultado"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="contenedor-acciones">
                <p id="p-estado">Cargar imagen</p>
                <input type="file" id="input-original" accept="image/*">
                <button type="button" id="btn-subir-Imagen">Analizar</button>
            </div>
        </div>
    </main>
    <script src="js/index.js"></script>
</body>

</html>
